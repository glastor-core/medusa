name: Deploy to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Edge Deployment
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC or token auth
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        continue-on-error: true
        with:
          project: medusa
          entrypoint: src/server.ts
          root: .
