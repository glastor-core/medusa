name: Deploy to Deno Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Edge Deployment
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC or token auth
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Code Quality Gates
        run: |
          deno check src/server.ts
          deno test --allow-net --allow-env --unstable-kv tests/

      - name: Deploy to Deno Deploy (console.deno.com)
        run: |
          deno install -gAr jsr:@deno/deployctl
          deployctl deploy --project=medusa --entrypoint=src/server.ts --prod
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}

      - name: Post-Deployment Verification
        run: |
          echo "Edge deployment to console.deno.com successfully finalized."
